name: Live lifecycle demo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-lifecycle-demo
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run lifecycle checks
        env:
          SUPERSERVE_API_KEY: ${{ secrets.SUPERSERVE_API_KEY }}
        run: python run.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-evidence-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 7
